<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Garden Plots | Sign in</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <div class="header-inner">
        <a class="brand" href="index.html">Community Garden Plots</a>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="plots.html">Plots</a>
            <a href="tools.html">Tools</a>
            <a href="duties.html">Watering</a>
        </nav>
    </div>
</header>

<main class="container">
    <section class="panel intro">
        <h1>Welcome to the garden</h1>
        <p>Apply for a plot each season, borrow shared tools and keep track of your watering duties, all in one place.</p>
    </section>

    <section class="panel">
        <h2>Sign in</h2>
        <form id="login-form">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email">

            <label for="login-password">Password</label>
            <input id="login-password" name="password" type="password">

            <button type="submit">Sign in</button>
        </form>
    </section>

    <section class="panel">
        <h2>Create a resident account</h2>
        <form id="register-form">
            <label for="register-name">Full name</label>
            <input id="register-name" name="name" type="text">

            <label for="register-email">Email</label>
            <input id="register-email" name="email" type="email">

            <label for="register-password">Password</label>
            <input id="register-password" name="password" type="password">

            <button type="submit">Create account</button>
        </form>
    </section>
</main>
</body>
</html>
